<title>Kompass Landkarte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="landkarte-start" content="status">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-window canvas (pan/zoom tree, left to right) for the whole company – the app as its product,
   who does what, data, money and hiring. A lens colours it by status or by person; focus shows one branch.
   Colours follow the app's Harbor 2 palette: navy ink, indigo accent. */
:root {
  --bg: #EEF0F7; --grid: #DCE0EE; --surface: #FFFFFF; --surface-2: #F6F7FB;
  --ink: #18233F; --ink-2: #4D5262; --ink-3: #7A8094; --line: #C9CEDF;
  --accent: #3D4CC9; --accent-soft: #E3E6FA;
  /* status */
  --built: #1F8A5B; --built-soft: #DDF3E8; --partial: #B07A12; --partial-soft: #FBEFD6;
  --planned: #6B7392; --planned-soft: #ECEEF5; --idea: #8A4FC7; --idea-soft: #F1E7FB;
  /* person */
  --founder: #1F8A5B; --founder-soft: #DDF3E8; --partner: #C2477A; --partner-soft: #FBE4EE;
  --ai: #3D4CC9; --ai-soft: #E3E6FA; --ext: #B07A12; --ext-soft: #FBEFD6;
  --hire: #2D7FD3; --hire-soft: #DDECFB; --later: #6B7392; --later-soft: #ECEEF5;
  --money: #B5860B; --user: #2D7FD3; --link: #C2477A;
  --shadow: 0 1px 2px rgba(24,35,63,.08), 0 4px 14px rgba(24,35,63,.06);
  --f-display: "Space Grotesk", "Avenir Next", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1424; --grid: #1A2136; --surface: #18203A; --surface-2: #1E2744;
    --ink: #EEF0F8; --ink-2: #B9BED0; --ink-3: #8389A0; --line: #34405F;
    --accent: #8C98FF; --accent-soft: #252F5C;
    --built: #4CC98E; --built-soft: #16352A; --partial: #E6B34A; --partial-soft: #3A2E14;
    --planned: #9AA2BF; --planned-soft: #232B44; --idea: #C49BF2; --idea-soft: #2F2346;
    --founder: #4CC98E; --founder-soft: #16352A; --partner: #F07AAA; --partner-soft: #3A1A2A;
    --ai: #8C98FF; --ai-soft: #252F5C; --ext: #E6B34A; --ext-soft: #3A2E14;
    --hire: #6FB2F5; --hire-soft: #16304A; --later: #9AA2BF; --later-soft: #232B44;
    --money: #E8C15A; --user: #6FB2F5; --link: #F07AAA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1424; --grid: #1A2136; --surface: #18203A; --surface-2: #1E2744;
  --ink: #EEF0F8; --ink-2: #B9BED0; --ink-3: #8389A0; --line: #34405F;
  --accent: #8C98FF; --accent-soft: #252F5C;
  --built: #4CC98E; --built-soft: #16352A; --partial: #E6B34A; --partial-soft: #3A2E14;
  --planned: #9AA2BF; --planned-soft: #232B44; --idea: #C49BF2; --idea-soft: #2F2346;
  --founder: #4CC98E; --founder-soft: #16352A; --partner: #F07AAA; --partner-soft: #3A1A2A;
  --ai: #8C98FF; --ai-soft: #252F5C; --ext: #E6B34A; --ext-soft: #3A2E14;
  --hire: #6FB2F5; --hire-soft: #16304A; --later: #9AA2BF; --later-soft: #232B44;
  --money: #E8C15A; --user: #6FB2F5; --link: #F07AAA;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.brand small { color: var(--ink-3); font-size: 12px; }
.search { position: relative; }
.search input { font: inherit; font-size: 13px; width: 210px; max-width: 46vw; padding: 7px 10px 7px 30px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--ink-3); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.icon { padding: 6px 9px; }
.btn.focus { background: var(--accent); color: #fff; border-color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); z-index: 2; position: relative; }
.lab { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; color: var(--ink-3); margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-right: 6px; }
.seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; background: var(--surface-2); color: var(--ink-2); padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px 3px 7px; border: 1px solid transparent;
  cursor: pointer; font: inherit; font-size: 12px; background: transparent; color: var(--ink-2); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip:focus-visible { outline: 2px solid var(--accent); }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.mark { display: inline-flex; align-items: center; gap: 5px; }
.mark svg { width: 14px; height: 14px; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
svg.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.xlink { fill: none; stroke: var(--link); stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .7; }
.xlink.hot { opacity: 1; stroke-width: 2.2; }
.xlabel { font: 500 10.5px var(--f-body); fill: var(--link); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.node { cursor: pointer; }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node .t { font: 500 13px var(--f-body); fill: var(--ink); }
.node .sub { font: 400 11px var(--f-body); fill: var(--ink-3); }
.node .sub.mono { font: 400 10.5px var(--f-mono); }
.node.root .box { fill: var(--accent); stroke: var(--accent); }
.node.root .t { fill: #fff; font: 700 15px var(--f-display); }
.node.root .ic { color: #fff; }
.node.root .sub { fill: rgba(255,255,255,.82); }
.node.big .t { font-family: var(--f-display); font-weight: 600; font-size: 14px; }
.node.s-planned .box, .node.s-idea .box { stroke-dasharray: 5 4; fill: var(--surface-2); }
.node.sel .box { stroke: var(--accent); stroke-width: 2.4; }
.node.hit .box { stroke: var(--link); stroke-width: 2.4; }
.node.dim { opacity: .22; }
.node .ic { color: var(--ink-2); }
.node .own text { font: 600 10px var(--f-body); }
.knob circle.k { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.knob text { font: 600 11px var(--f-body); fill: var(--ink-2); }
.knob:hover circle.k { stroke: var(--accent); }

.panel { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 340px; max-height: calc(100% - 24px);
  overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); z-index: 4;
  display: flex; flex-direction: column; }
.panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.panel h2 { font-family: var(--f-display); font-size: 17px; margin: 0; line-height: 1.25; text-wrap: balance; }
.panel .close { margin-left: auto; flex: none; }
.panel .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; }
.panel code { font-family: var(--f-mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; display: block; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.panel h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0 0 4px; font-weight: 600; }
.panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.panel li button { font: inherit; font-size: 13px; text-align: left; width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 9px; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.panel li button:hover { border-color: var(--accent); }
.panel li button span { color: var(--ink-3); font-size: 11.5px; flex: none; }
.crumbs { font-size: 11.5px; color: var(--ink-3); }
.empty { padding: 16px; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.empty b { color: var(--ink); }
.status-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 14px; }

@media (max-width: 720px) {
  .panel { top: auto; bottom: max(10px, env(safe-area-inset-bottom, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
    right: max(10px, env(safe-area-inset-right, 0px)); width: auto; max-height: 52%; }
  .search input { width: 150px; }
  .legend { font-size: 11px; }
}
</style>

<div class="app">
  <div class="bar">
    <div class="brand"><h1>Landkarte</h1><small id="stand">lädt …</small></div>
    <label class="search" for="q">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Seite, Aufgabe, Person, Datei …" autocomplete="off">
    </label>
    <div class="tools">
      <button class="btn focus" id="unfocus" type="button" hidden>← Ganze Karte</button>
      <button class="btn" id="expandAll" type="button">Alles aufklappen</button>
      <button class="btn" id="collapseAll" type="button">Einklappen</button>
      <button class="btn" id="links" type="button" aria-pressed="false">Alle Querverweise</button>
      <button class="btn icon" id="zoomOut" type="button" aria-label="Verkleinern">−</button>
      <button class="btn icon" id="zoomIn" type="button" aria-label="Vergrößern">+</button>
      <button class="btn" id="fit" type="button">Einpassen</button>
    </div>
  </div>
  <div class="legend">
    <span class="lab">Farbe nach</span>
    <span class="seg" role="group" aria-label="Farbe nach">
      <button type="button" id="lensStatus" aria-pressed="true">Status</button>
      <button type="button" id="lensOwner" aria-pressed="false">Person</button>
    </span>
    <span class="chips" id="chips"></span>
    <span class="sep"></span>
    <span class="mark" style="color:var(--user)"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5" r="3"/><path d="M2.5 14.5c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z"/></svg>Nutzer handelt</span>
    <span class="mark" style="color:var(--money)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><text x="8" y="11.3" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Inter,sans-serif">$</text></svg>Umsatz</span>
    <span class="mark" style="color:var(--link)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"><path d="M2 12C5 3 11 3 14 10"/></svg>Querverweis</span>
  </div>
  <div class="stage" id="stage">
    <svg class="map" id="map" role="img" aria-label="Landkarte von App und Firma"><g class="vp" id="vp"><g id="edges"></g><g id="xlinks"></g><g id="nodes"></g></g></svg>
    <div class="status-msg" id="msg">Landkarte wird geladen …</div>
    <aside class="panel" id="panel" aria-live="polite">
      <div class="empty"><b>Antippen</b> zeigt Details: wer es macht, Status, Datei und Verbindungen. <b>+ / −</b> klappt auf und zu. Oben umschalten: Farbe nach <b>Status</b> oder nach <b>Person</b>. Im Detailfeld zeigt <b>„Nur diesen Ast“</b> einen Bereich allein.</div>
    </aside>
  </div>
</div>

<script>
(() => {
  const KIND = {
    root: "Firma", app: "App", people: "Personen", person: "Person", dept: "Abteilung", area: "Bereich", task: "Aufgabe",
    plan: "Plan", phase: "Phase", role: "Stelle", flow: "Ablauf", tab: "Tab", page: "Seite", sheet: "Sheet", cover: "Vollbild",
    card: "Karte", storage: "Speicher", logic: "Logik", service: "Dienst", money: "Umsatz", group: "Bereich"
  };
  const LENS = {
    status: { key: "s", label: { built: "Gebaut / aktiv", partial: "Teilweise / Demo", planned: "Geplant", idea: "Idee" } },
    owner: { key: "o", label: { founder: "Du (Gründer)", partner: "Partnerin (evtl.)", ai: "Claude", ext: "Extern auf Rechnung", hire: "Erste Stellen", later: "Später" } }
  };
  const OWNER_SHORT = { founder: "Du", partner: "Partnerin", ai: "Claude", ext: "Extern", hire: "Stelle", later: "Später" };
  const ICON = {
    root: '<path d="M2.5 14.5v-9l5.5-3 5.5 3v9z"/><path d="M6 14.5v-3.5h4v3.5M5.5 7.5h1M9.5 7.5h1"/>',
    app: '<rect x="4.5" y="1.5" width="7" height="13" rx="2"/><path d="M7 12.5h2"/>',
    people: '<circle cx="5.5" cy="5.5" r="2.2"/><circle cx="11" cy="6" r="1.8"/><path d="M1.5 13.5c.5-2.6 2-3.8 4-3.8s3.5 1.2 4 3.8M10 9.8c1.9 0 3.3 1.1 3.8 3.4"/>',
    person: '<circle cx="8" cy="5" r="2.6"/><path d="M3 14c.6-3 2.5-4.4 5-4.4s4.4 1.4 5 4.4"/>',
    dept: '<rect x="2" y="2" width="12" height="4" rx="1.2"/><rect x="2" y="7" width="12" height="3" rx="1"/><rect x="2" y="11" width="12" height="3" rx="1"/>',
    area: '<rect x="1.5" y="3.5" width="13" height="9" rx="2"/><path d="M4 7h5M4 9.5h3"/>',
    task: '<rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M5 8.2l2 2 4-4.4"/>',
    plan: '<path d="M2 13.5l4-4 3 2.5 5-6"/><path d="M10.5 6h3.5v3.5"/>',
    phase: '<path d="M3.5 14.5v-12"/><path d="M3.5 2.5h8.5l-2 3 2 3H3.5"/>',
    role: '<circle cx="6.5" cy="5" r="2.5"/><path d="M1.5 14c.6-3 2.4-4.4 5-4.4 1.2 0 2.2.3 3 .9"/><path d="M12 9.5v5M9.5 12h5"/>',
    flow: '<path d="M2 8h9"/><path d="M8 4.5L11.5 8 8 11.5"/><circle cx="13.5" cy="8" r="1"/>',
    tab: '<rect x="1.5" y="9.5" width="13" height="5" rx="1.5"/><path d="M4.5 12h1M7.5 12h1M10.5 12h1"/><path d="M3 2.5h10"/>',
    page: '<path d="M4 1.5h5.5L12.5 4.5v10h-8.5z"/><path d="M6 7.5h4.5M6 10h4.5"/>',
    sheet: '<rect x="2" y="1.5" width="12" height="13" rx="2"/><path d="M2 7h12"/><path d="M6.5 4h3"/>',
    cover: '<rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M4 4h3M4 4v3M12 12h-3M12 12v-3"/>',
    card: '<rect x="1.5" y="3.5" width="13" height="9" rx="2"/><path d="M4 7h5M4 9.5h3"/>',
    storage: '<ellipse cx="8" cy="3.5" rx="5.5" ry="2"/><path d="M2.5 3.5v9c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-9"/><path d="M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
    logic: '<rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6h2.5M1.5 10h2.5M12 6h2.5M12 10h2.5"/>',
    service: '<path d="M4.5 12.5h7.5a3 3 0 0 0 .4-6A4 4 0 0 0 4.7 6 3.2 3.2 0 0 0 4.5 12.5z"/>',
    money: '<circle cx="8" cy="8" r="6.5"/><path d="M10 5.5H7.2a1.3 1.3 0 0 0 0 2.6h1.6a1.3 1.3 0 0 1 0 2.6H6M8 4v1.5M8 10.7v1.5"/>',
    group: '<rect x="2" y="2" width="12" height="4" rx="1.2"/><rect x="2" y="7" width="12" height="3" rx="1"/><rect x="2" y="11" width="12" height="3" rx="1"/>'
  };
  const BIG = new Set(["dept", "people", "plan", "app", "tab", "group"]);
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), vp = $("vp"), gE = $("edges"), gX = $("xlinks"), gN = $("nodes"), panel = $("panel");
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("lk2." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("lk2." + k, JSON.stringify(v)); } catch {} }
  };

  let root, top, all = [], byId = new Map(), view = { x: 40, y: 40, k: 1 }, sel = null, showLinks = false, query = "";
  let lens = (document.querySelector('meta[name="landkarte-start"]') || {}).content === "owner" ? "owner" : "status";
  const filters = { status: new Set(Object.keys(LENS.status.label)), owner: new Set(Object.keys(LENS.owner.label)) };

  // ---------- data ----------
  function prepare(n, parent, depth) {
    n.parent = parent; n.depth = depth; n.key = (parent ? parent.key + "/" : "") + (n.id || n.t);
    n.c = n.c || []; n.to = n.to || [];
    all.push(n); if (n.id) byId.set(n.id, n);
    n.c.forEach(c => prepare(c, n, depth + 1));
  }
  function defaultOpen(n) { return n.depth <= 1 || n.id === "prod"; }
  function inTop(n) { for (let p = n; p; p = p.parent) if (p === top) return true; return false; }
  function rel(n) { return n.depth - top.depth; }

  // ---------- measuring ----------
  const ctx = document.createElement("canvas").getContext("2d");
  function textW(s, font) { ctx.font = font; return ctx.measureText(s).width; }
  function fontFor(n) {
    if (n === top) return '700 15px "Space Grotesk", sans-serif';
    if (BIG.has(n.k) || rel(n) === 1) return '600 14px "Space Grotesk", sans-serif';
    return '500 13px Inter, sans-serif';
  }
  const H = 36, HS = 50, VGAP = 8, HGAP = 22, ROWGAP = 56, INDENT = 22;
  function fileSub(n) { return n.f ? n.f.split(" · ")[0].replace(/^Kompass\//, "") : ""; }
  function subtitle(n) { return n.who || fileSub(n) || n.when || ""; }
  function clip(s) { return s.length > 50 ? s.slice(0, 49) + "…" : s; }
  // The person badge only where the person changes from the parent – otherwise every node would repeat it.
  function ownBadge(n) { return n.o && n !== top && (!n.parent || n.parent.o !== n.o) ? OWNER_SHORT[n.o] : ""; }
  function size(n) {
    const sub = subtitle(n);
    const tw = textW(n.t, fontFor(n));
    const sw = sub ? textW(clip(sub), '400 11px Inter, sans-serif') : 0;
    const ob = ownBadge(n);
    n.ow = ob ? Math.ceil(textW(ob, '600 10px Inter, sans-serif') + 12) : 0;
    const badges = (n.u ? 18 : 0) + (n.r ? 18 : 0) + (n.ow ? n.ow + 6 : 0);
    n.w = Math.ceil(Math.max(tw + badges + 6, sw) + 33 + (n.c.length ? 26 : 12));
    n.h = sub ? HS : H;
  }

  // ---------- layout (top to bottom, like an org chart) ----------
  // Children sit in a row under their parent. A group whose children are all closed or leaves is stacked as a
  // short list under it instead (classic org chart), so the chart stays narrow enough to read.
  function visibleKids(n) { return n.open ? n.c : []; }
  function stacks(n) { const k = visibleKids(n); return k.length > 1 && k.every(c => !visibleKids(c).length); }
  function layout() {
    (function sizes(n) { size(n); visibleKids(n).forEach(sizes); })(top);
    let cursor = 0;
    (function place(n, y) {
      n.y = y;
      const kids = visibleKids(n);
      n.stacked = stacks(n);
      if (!kids.length) { n.x = cursor; cursor += n.w + HGAP; return; }
      if (n.stacked) {
        n.x = cursor;
        let yy = y + n.h + VGAP;
        kids.forEach(c => { c.y = yy; c.x = n.x + INDENT; c.stacked = false; yy += c.h + VGAP; });
        cursor += Math.max(n.w, ...kids.map(c => c.w + INDENT)) + HGAP;
        return;
      }
      kids.forEach(c => place(c, y + n.h + ROWGAP));
      const first = kids[0], last = kids[kids.length - 1];
      n.x = (first.x + last.x + last.w) / 2 - n.w / 2;
    })(top, 0);
  }
  function visibleNodes() { const out = []; (function w(n) { out.push(n); visibleKids(n).forEach(w); })(top); return out; }
  function isVisible(n) { if (!inTop(n)) return false; for (let p = n.parent; p && p !== top.parent; p = p.parent) if (!p.open) return false; return true; }

  // ---------- drawing ----------
  function el(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function color(n) { return `var(--${n[LENS[lens].key]})`; }
  function matches(n, q) {
    return [n.t, n.f, n.n, n.who, n.when].some(x => (x || "").toLowerCase().includes(q));
  }

  function render() {
    layout();
    gE.textContent = ""; gX.textContent = ""; gN.textContent = "";
    const vis = visibleNodes();
    const q = query.trim().toLowerCase();
    const on = filters[lens], key = LENS[lens].key;
    vis.forEach(n => visibleKids(n).forEach(c => {
      if (n.stacked) {       // list under the parent: down its left side, then into the child
        const x = n.x + INDENT / 2;
        el("path", { class: "edge", d: `M${x},${n.y + n.h} V${c.y + c.h / 2} H${c.x}` }, gE);
      } else {               // org chart elbow: down, across, down
        const x1 = n.x + n.w / 2, y1 = n.y + n.h, x2 = c.x + c.w / 2, y2 = c.y, my = y1 + ROWGAP / 2;
        el("path", { class: "edge", d: `M${x1},${y1} V${my} H${x2} V${y2}` }, gE);
      }
    }));
    // All cross links with the switch on; otherwise only those of the selected node.
    vis.forEach(n => n.to.forEach(([id, label]) => {
      const t = byId.get(id); if (!t || !isVisible(t)) return;
      const hot = sel && (sel === n || sel === t);
      if (!showLinks && !hot) return;
      const a = { x: n.x + n.w / 2, y: n.y + n.h }, b = { x: t.x + t.w / 2, y: t.y };
      const up = b.y < a.y;
      const s = up ? { x: n.x + n.w / 2, y: n.y } : a, e = up ? { x: t.x + t.w / 2, y: t.y + t.h } : b;
      const bend = Math.max(40, Math.abs(e.x - s.x) * 0.25);
      el("path", { class: "xlink" + (hot ? " hot" : ""), d: `M${s.x},${s.y} C${s.x + bend},${(s.y + e.y) / 2} ${e.x - bend},${(s.y + e.y) / 2} ${e.x},${e.y}` }, gX);
      if (hot && label) { const tx = el("text", { class: "xlabel", x: (s.x + e.x) / 2, y: (s.y + e.y) / 2 - 4, "text-anchor": "middle" }, gX); tx.textContent = label; }
    }));
    vis.forEach(n => {
      const match = q && matches(n, q);
      const dim = !on.has(n[key]) || (q && !match && n !== top);
      const isTop = n === top;
      const g = el("g", { class: `node k-${n.k} s-${n.s}` + (isTop ? " root" : "") + (BIG.has(n.k) || rel(n) === 1 ? " big" : "") + (sel === n ? " sel" : "") + (match ? " hit" : "") + (dim ? " dim" : ""),
        transform: `translate(${n.x},${n.y})`, tabindex: "0", role: "button",
        "aria-label": `${n.t}, ${KIND[n.k] || ""}, ${LENS.status.label[n.s] || ""}, ${LENS.owner.label[n.o] || ""}` }, gN);
      el("rect", { class: "box", width: n.w, height: n.h, rx: 10 }, g);
      if (!isTop) el("rect", { x: 0, y: 7, width: 3.5, height: n.h - 14, rx: 1.75, fill: color(n) }, g);
      const ic = el("g", { class: "ic", transform: `translate(11,${n.h / 2 - 8})`, fill: "none", stroke: "currentColor", "stroke-width": 1.3, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      ic.innerHTML = ICON[n.k] || ICON.area;
      const sub = subtitle(n);
      const ty = sub ? 21 : n.h / 2 + 4.5;
      const tx = el("text", { class: "t", x: 33, y: ty }, g); tx.textContent = n.t;
      let bx = 33 + textW(n.t, fontFor(n)) + 6;
      if (n.ow) {
        const ob = el("g", { class: "own", transform: `translate(${bx},${ty - 12})` }, g);
        el("rect", { width: n.ow, height: 16, rx: 8, fill: `var(--${n.o}-soft)` }, ob);
        const ot = el("text", { x: n.ow / 2, y: 11.5, "text-anchor": "middle", fill: `var(--${n.o})` }, ob); ot.textContent = ownBadge(n);
        bx += n.ow + 6;
      }
      if (n.u) { const b = el("g", { transform: `translate(${bx},${ty - 11})`, fill: "var(--user)" }, g);
        b.innerHTML = '<circle cx="7" cy="4.6" r="2.7"/><path d="M2 13c.6-2.8 2.5-4.1 5-4.1s4.4 1.3 5 4.1z"/>'; bx += 18; }
      if (n.r) { const b = el("g", { transform: `translate(${bx},${ty - 11})` }, g);
        b.innerHTML = '<circle cx="7" cy="7" r="6.3" fill="var(--money)"/><text x="7" y="10.3" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff" font-family="Inter,sans-serif">$</text>'; }
      if (sub) { const st = el("text", { class: "sub" + (!n.who && n.f ? " mono" : ""), x: 33, y: 38 }, g); st.textContent = clip(sub); }
      if (n.c.length) {
        const kb = el("g", { class: "knob", transform: `translate(${n.w - 13},${n.h / 2})` }, g);
        el("circle", { r: 16, style: "fill:transparent;stroke:none" }, kb);      // bigger hit area
        el("circle", { class: "k", r: 8.5 }, kb);
        const kt = el("text", { "text-anchor": "middle", y: 3.8 }, kb); kt.textContent = n.open ? "−" : n.c.length;
        kb.addEventListener("click", (e) => { e.stopPropagation(); toggle(n); });
      }
      g.addEventListener("click", () => select(n));
      g.addEventListener("dblclick", (e) => { e.stopPropagation(); if (n.c.length) toggle(n); });
      g.addEventListener("keydown", (e) => {
        if (e.key === "Enter") select(n);
        if (e.key === " ") { e.preventDefault(); if (n.c.length) toggle(n); }
      });
    });
    applyView();
    store.set("open", all.filter(n => n.open).map(n => n.key));
    $("unfocus").hidden = top === root;
  }

  function applyView() { vp.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); store.set("view", view); }

  // ---------- legend ----------
  function drawChips() {
    const c = $("chips"); c.textContent = "";
    for (const [k, label] of Object.entries(LENS[lens].label)) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", filters[lens].has(k));
      b.innerHTML = `<span class="dot" style="background:var(--${k})"></span>${label}`;
      b.addEventListener("click", () => { if (filters[lens].has(k)) filters[lens].delete(k); else filters[lens].add(k); drawChips(); render(); });
      c.appendChild(b);
    }
    $("lensStatus").setAttribute("aria-pressed", lens === "status");
    $("lensOwner").setAttribute("aria-pressed", lens === "owner");
  }
  function setLens(l) { lens = l; store.set("lens", l); drawChips(); render(); if (sel) showPanel(sel); }

  // ---------- state ----------
  function toggle(n) {
    const before = { x: n.x, y: n.y };
    n.open = !n.open; render();
    view.x += (before.x - n.x) * view.k; view.y += (before.y - n.y) * view.k; applyView();
  }
  function reveal(n) { for (let p = n.parent; p; p = p.parent) p.open = true; }
  function center(n) {
    const r = stage.getBoundingClientRect();
    const panelW = window.innerWidth > 720 && !panel.hidden ? 360 : 0;
    view.x = (r.width - panelW) / 2 - (n.x + n.w / 2) * view.k;
    view.y = r.height / (window.innerWidth > 720 ? 2 : 3.2) - (n.y + n.h / 2) * view.k;
    applyView();
  }
  function goTo(n) { if (!inTop(n)) top = root; reveal(n); sel = n; render(); center(n); showPanel(n); }
  function select(n) { sel = n; render(); showPanel(n); }
  function focusOn(n) { top = n; n.open = true; sel = n; render(); fit(); showPanel(n); }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function pill(group, k) { return k ? `<span class="pill" style="background:var(--${k}-soft);color:var(--${k})">${LENS[group].label[k] || k}</span>` : ""; }
  function nodeButton(n, extra) { return `<li><button type="button" data-key="${esc(n.key)}">${esc(n.t)}${extra ? `<span>${esc(extra)}</span>` : ""}</button></li>`; }
  function field(title, v, code) { return v ? `<div><h3>${title}</h3>${code ? `<code>${esc(v.split(" · ").join("\n"))}</code>` : `<div>${esc(v)}</div>`}</div>` : ""; }

  function showPanel(n) {
    const path = []; for (let p = n.parent; p; p = p.parent) path.unshift(p.t);
    const incoming = all.filter(m => m.to.some(([id]) => id === n.id));
    panel.innerHTML = `
      <header><div style="min-width:0">
        <div class="crumbs">${esc(path.join(" › ") || "Start")}</div>
        <h2>${esc(n.t)}</h2></div>
        <button class="btn icon close" type="button" aria-label="Details schließen">×</button></header>
      <div class="body">
        <div class="row">${pill("status", n.s)}${pill("owner", n.o)}<span class="pill" style="background:var(--surface-2);color:var(--ink-2)">${KIND[n.k] || n.k}</span>
          ${n.u ? '<span class="pill" style="background:var(--surface-2);color:var(--user)">Nutzer handelt</span>' : ""}
          ${n.r ? '<span class="pill" style="background:var(--partial-soft);color:var(--money)">Umsatz</span>' : ""}</div>
        ${n.n ? `<div>${esc(n.n)}</div>` : ""}
        ${field("Wer", n.who)}${field("Wann / Auslöser", n.when)}${field("Kosten", n.cost)}${field("Code", n.f, true)}
        ${n.c.length && n !== top ? `<div><button class="btn" type="button" id="focusBtn">Nur diesen Ast zeigen</button></div>` : ""}
        ${n.c.length ? `<div><h3>Darunter (${n.c.length})</h3><ul>${n.c.map(k => nodeButton(k, KIND[k.k])).join("")}</ul></div>` : ""}
        ${n.to.length ? `<div><h3>Verbunden mit</h3><ul>${n.to.map(([id, l]) => byId.get(id) ? nodeButton(byId.get(id), l) : "").join("")}</ul></div>` : ""}
        ${incoming.length ? `<div><h3>Kommt vor bei</h3><ul>${incoming.map(m => nodeButton(m, (m.to.find(([id]) => id === n.id) || [])[1])).join("")}</ul></div>` : ""}
      </div>`;
    panel.hidden = false;
    panel.querySelector(".close").addEventListener("click", () => { panel.hidden = true; sel = null; render(); });
    const fb = panel.querySelector("#focusBtn"); if (fb) fb.addEventListener("click", () => focusOn(n));
    panel.querySelectorAll("button[data-key]").forEach(b => b.addEventListener("click", () => {
      const t = all.find(m => m.key === b.dataset.key); if (t) goTo(t);
    }));
  }

  function fit() {
    const vis = visibleNodes(); if (!vis.length) return;
    const minX = Math.min(...vis.map(n => n.x)), maxX = Math.max(...vis.map(n => n.x + n.w));
    const minY = Math.min(...vis.map(n => n.y)), maxY = Math.max(...vis.map(n => n.y + n.h));
    const r = stage.getBoundingClientRect();
    const panelW = window.innerWidth > 720 && !panel.hidden ? 360 : 0;
    const k = Math.min(1.2, Math.max(0.12, Math.min((r.width - panelW - 60) / (maxX - minX), (r.height - 60) / (maxY - minY))));
    view.k = k; view.x = (r.width - panelW - (maxX - minX) * k) / 2 - minX * k; view.y = 30 - minY * k; applyView();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.min(2.5, Math.max(0.1, view.k * f)); const r = k / view.k;
    view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; applyView();
  }

  // ---------- input ----------
  const pts = new Map(); let last = null, pinch0 = null, moved = false;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".panel")) return;
    // No pointer capture yet: a plain tap must still reach the node or its +/− (captured, the click would land on the stage).
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (pts.size === 1) last = { x: e.clientX, y: e.clientY };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; }
  });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch0) {
      const [a, b] = [...pts.values()]; const r = stage.getBoundingClientRect();
      const d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((pinch0.k * d / pinch0.d) / view.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); moved = true; return;
    }
    if (last) { const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) > 3) {          // a real drag: now take over the pointer
        moved = true; stage.classList.add("dragging");
        try { stage.setPointerCapture(e.pointerId); } catch {}
      }
      view.x += dx; view.y += dy; last = { x: e.clientX, y: e.clientY }; applyView(); }
  });
  function up(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; if (!pts.size) { last = null; stage.classList.remove("dragging"); } }
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  stage.addEventListener("wheel", (e) => {
    if (e.target.closest(".panel")) return;
    e.preventDefault(); const r = stage.getBoundingClientRect();
    // Trackpad pinch (ctrl) or a mouse wheel (line steps) zooms; two-finger scrolling on a trackpad pans.
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else if (e.deltaMode !== 0) zoomAt(e.deltaY > 0 ? 0.9 : 1.1, e.clientX - r.left, e.clientY - r.top);
    else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
  }, { passive: false });

  $("zoomIn").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
  $("zoomOut").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
  $("fit").onclick = fit;
  $("unfocus").onclick = () => { const s = top; top = root; reveal(s); render(); center(s); };
  $("expandAll").onclick = () => { all.filter(inTop).forEach(n => n.open = true); render(); fit(); };
  $("collapseAll").onclick = () => { all.filter(inTop).forEach(n => n.open = n === top); render(); fit(); };
  $("links").onclick = (e) => { showLinks = !showLinks; e.currentTarget.setAttribute("aria-pressed", showLinks); render(); };
  $("lensStatus").onclick = () => setLens("status");
  $("lensOwner").onclick = () => setLens("owner");
  let qTimer; $("q").addEventListener("input", (e) => {
    query = e.target.value; clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      const q = query.trim().toLowerCase();
      if (q) { const hits = all.filter(n => matches(n, q));
        if (hits.length && !hits.some(inTop)) top = root;
        hits.forEach(reveal); render(); const h = hits.find(inTop); if (h) { sel = h; render(); center(h); showPanel(h); } }
      else render();
    }, 220);
  });
  window.addEventListener("resize", () => applyView());

  // ---------- start ----------
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]);
  Promise.all([fetch("landkarte.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), fontsReady]).then(([data]) => {
    const v = store.get("view"), savedLens = store.get("lens");
    if (savedLens === "status" || savedLens === "owner") lens = savedLens;
    root = data.root; top = root; prepare(root, null, 0);
    $("stand").textContent = `${all.length} Knoten · Stand ${data.meta.stand}`;
    const saved = store.get("open");
    all.forEach(n => n.open = saved ? saved.includes(n.key) : defaultOpen(n));
    root.open = true;
    $("msg").hidden = true;
    drawChips(); render();
    if (v && typeof v.k === "number") { view = v; applyView(); }
    else {
      // First visit: readable size, the firm at the top in the middle (the whole map with "Einpassen").
      fit();
      if (view.k < 0.6) {
        const r = stage.getBoundingClientRect(); view.k = 0.6;
        view.x = r.width / 2 - (root.x + root.w / 2) * view.k; view.y = 24 - root.y * view.k; applyView();
      }
    }
  }).catch(() => {
    $("msg").textContent = "Die Landkarte konnte nicht geladen werden (landkarte.json fehlt). Seite neu laden.";
  });
})();
</script>
